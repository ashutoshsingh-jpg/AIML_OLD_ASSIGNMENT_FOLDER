services:
  - type: web
    name: autoworth-ai-docker
    env: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: APP_NAME
        value: "AutoWorth AI"
    autoDeploy: true
